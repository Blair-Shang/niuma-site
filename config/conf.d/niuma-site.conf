# 本站独立 server。
# 放到：/data/nginx/conf/conf.d/niuma-site.conf
# 主配置 http { } 只写：include conf.d/*.conf;
# 不要放进 conf.d/routes/。
#
# 证书：/data/nginx/ssl/niuma007.com.pem + .key
# 后端：127.0.0.1:8080

upstream niuma_site {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream niuma_cloud {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name niuma007.com www.niuma007.com;

    ssl_certificate     /data/nginx/ssl/niuma007.com.pem;
    ssl_certificate_key /data/nginx/ssl/niuma007.com.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    # niuma-cloud：工程根 /niuma（API /niuma/cloud、Ops /niuma/ops）
    location = /niuma {
        return 302 /niuma/ops/;
    }

    # 清单 / 检查 / 计数 / 解析 latest：共用 http 层 10m zone（60 次/秒）。
    location ~ ^/niuma/cloud/api/v1/updates/(latest|check|releases|download|hit)$ {
        limit_req zone=niuma_dl_latest burst=8 nodelay;
        client_max_body_size 1m;
        proxy_pass http://niuma_cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 安装包：限并发与单连接速率，保留 Range / 长超时。
    location /niuma/cloud/api/v1/updates/files/ {
        limit_conn niuma_dl_conn 4;
        limit_rate 8m;
        client_max_body_size 1m;
        proxy_pass http://niuma_cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /niuma/ {
        # 流水线上传 / 其余 API（可达 2GB）
        client_max_body_size 2g;
        proxy_pass http://niuma_cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        proxy_pass http://niuma_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
