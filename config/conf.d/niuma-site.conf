# 本站独立 server。
# 放到：/data/nginx/conf/conf.d/niuma-site.conf
# 主配置 http { } 只写：include conf.d/*.conf;
# 不要放进 conf.d/routes/。
#
# 证书：/data/nginx/ssl/niuma007.com.pem + .key
# 后端：127.0.0.1:8080

upstream niuma_site {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name niuma007.com www.niuma007.com;

    ssl_certificate     /data/nginx/ssl/niuma007.com.pem;
    ssl_certificate_key /data/nginx/ssl/niuma007.com.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    location / {
        proxy_pass http://niuma_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
